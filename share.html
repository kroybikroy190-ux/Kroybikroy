  <script>

    const APP_URL =
      "https://kroybikroy190-ux.github.io/Kroybikroy/";

    const SHARE_TEXT =
      "🛒 ক্রয়-বিক্রয় অ্যাপ দেখুন — সহজে পণ্য কিনুন, বিক্রি করুন এবং User-to-User লেনদেন করুন।";


    /*
      মোবাইলে Share বাটন চাপলে
      ফোনের Native Share Menu খুলবে
    */

    async function shareApp() {

      if (navigator.share) {

        try {

          await navigator.share({

            title:
              "🛒 ক্রয়-বিক্রয় | Buy & Sell",

            text:
              SHARE_TEXT,

            url:
              APP_URL

          });

        } catch (error) {

          // User share menu বন্ধ করলে কিছু করবে না

        }

      } else {

        copyLink();

      }

    }


    /*
      অ্যাপের লিংক কপি
    */

    async function copyLink() {

      try {

        await navigator.clipboard.writeText(
          APP_URL
        );

        alert(
          "✅ অ্যাপের লিংক কপি হয়েছে। এখন Facebook, WhatsApp, Telegram বা SMS-এ পেস্ট করুন।"
        );

      } catch (error) {

        prompt(
          "এই লিংকটি কপি করুন:",
          APP_URL
        );

      }

    }

  </script>
